<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1118"/>
      <stop offset="60%" style="stop-color:#111827"/>
      <stop offset="100%" style="stop-color:#1f2937"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c99830;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#c99830;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#deb145;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c99830;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle dot pattern -->
  <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="15" cy="15" r="1" fill="#c99830" opacity="0.07"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Gold radial glow top-right -->
  <radialGradient id="glow" cx="75%" cy="20%" r="50%">
    <stop offset="0%" style="stop-color:#c99830;stop-opacity:0.12"/>
    <stop offset="100%" style="stop-color:#c99830;stop-opacity:0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Gold horizontal rule -->
  <rect x="0" y="420" width="1200" height="2" fill="url(#goldLine)" opacity="0.6"/>

  <!-- Left content area -->
  <!-- RERA badge -->
  <rect x="80" y="80" width="160" height="28" rx="14" fill="none" stroke="#c99830" stroke-width="1" opacity="0.4"/>
  <text x="160" y="99" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#c99830" opacity="0.8" letter-spacing="2">RERA REGISTERED</text>

  <!-- Main headline -->
  <text x="80" y="185" font-family="Georgia,serif" font-size="62" font-weight="700" fill="white" letter-spacing="-1">Suraksha</text>
  <text x="80" y="260" font-family="Georgia,serif" font-size="62" font-weight="700" fill="#c99830">Whispering Waves</text>

  <!-- Subheadline -->
  <text x="80" y="320" font-family="Arial,sans-serif" font-size="22" fill="#9ca3af" font-weight="300">2, 3 &amp; 4 BHK Homes near Begur Lake</text>
  <text x="80" y="352" font-family="Arial,sans-serif" font-size="18" fill="#6b7280">Begur, South Bengaluru · RERA: PRM/KA/RERA/…/008555</text>

  <!-- Feature pills -->
  <rect x="80" y="380" width="130" height="28" rx="6" fill="#c99830" opacity="0.15"/>
  <text x="145" y="399" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#c99830" font-weight="600">6 Towers A–F</text>

  <rect x="222" y="380" width="160" height="28" rx="6" fill="#c99830" opacity="0.15"/>
  <text x="302" y="399" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#c99830" font-weight="600">137-acre Begur Lake</text>

  <rect x="394" y="380" width="160" height="28" rx="6" fill="#c99830" opacity="0.15"/>
  <text x="474" y="399" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#c99830" font-weight="600">Club Élan Clubhouse</text>

  <!-- Divider vertical -->
  <rect x="750" y="60" width="1" height="510" fill="#c99830" opacity="0.15"/>

  <!-- Right side — A-Line branding -->
  <text x="850" y="200" text-anchor="middle" font-family="Georgia,serif" font-size="28" font-weight="700" fill="white">A-Line</text>
  <text x="850" y="236" text-anchor="middle" font-family="Georgia,serif" font-size="28" font-weight="700" fill="#c99830">Realty</text>
  <text x="850" y="268" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" letter-spacing="3">BENGALURU</text>

  <rect x="780" y="295" width="140" height="1" fill="#c99830" opacity="0.3"/>

  <text x="850" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#9ca3af">Property Information &amp;</text>
  <text x="850" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#9ca3af">Home-Buying Assistance</text>

  <text x="850" y="400" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#c99830" font-weight="600">+91 73378 61296</text>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#0c1118" opacity="0.8"/>
  <text x="80" y="615" font-family="Arial,sans-serif" font-size="12" fill="#4b5563">Developer / Promoter: R K Suraksha Properties · © A-Line Realty</text>
  <text x="1120" y="615" text-anchor="end" font-family="Arial,sans-serif" font-size="12" fill="#c99830">Get Latest Price →</text>
</svg>
