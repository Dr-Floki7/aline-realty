<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" width="400" height="380">
  <!-- Background -->
  <rect width="400" height="380" fill="#e0f2fe"/>
  <!-- Grid lines -->
  <line x1="40" y1="40" x2="40" y2="340" stroke="#0284c7" stroke-width="0.4" opacity="0.3"/>
  <line x1="360" y1="40" x2="360" y2="340" stroke="#0284c7" stroke-width="0.4" opacity="0.3"/>
  <line x1="40" y1="40" x2="360" y2="40" stroke="#0284c7" stroke-width="0.4" opacity="0.3"/>
  <line x1="40" y1="340" x2="360" y2="340" stroke="#0284c7" stroke-width="0.4" opacity="0.3"/>
  <!-- Outer boundary -->
  <rect x="36" y="36" width="328" height="308" fill="none" stroke="#0284c7" stroke-width="2" rx="2"/>
  <!-- Room layout -->
  <!-- Master Bedroom -->
  <rect x="40" y="40" width="155" height="120" fill="white" stroke="#0284c7" stroke-width="1.5" rx="2"/>
  <text x="117" y="104" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#0369a1">Master Bedroom</text>
  <!-- Bedroom 2 -->
  <rect x="205" y="40" width="155" height="120" fill="white" stroke="#0284c7" stroke-width="1.5" rx="2"/>
  <text x="282" y="104" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#0369a1">Bedroom 2</text>
  <!-- Living + Dining -->
  <rect x="40" y="170" width="200" height="100" fill="white" stroke="#0284c7" stroke-width="1.5" rx="2"/>
  <text x="140" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#0369a1">Living / Dining</text>
  <!-- Kitchen -->
  <rect x="250" y="170" width="110" height="100" fill="white" stroke="#0284c7" stroke-width="1.5" rx="2"/>
  <text x="305" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#0369a1">Kitchen</text>
  <!-- Balcony -->
  <rect x="40" y="280" width="320" height="40" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" rx="2" opacity="0.6"/>
  <text x="200" y="304" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#0369a1" opacity="0.8">Balcony</text>
  <!-- Labels at top -->
  <rect x="0" y="0" width="400" height="32" fill="#0284c7" opacity="0.9" rx="0"/>
  <text x="12" y="20" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="white">Type C2 · 2 BHK · Tower C</text>
  <!-- Area info footer -->
  <rect x="0" y="350" width="400" height="30" fill="#1f2937" opacity="0.9"/>
  <text x="12" y="370" font-family="Arial,sans-serif" font-size="10" fill="#c99830">SBA: 1,215 sq.ft</text>
  <text x="200" y="370" font-family="Arial,sans-serif" font-size="10" fill="#9ca3af">Carpet: 831 sq.ft</text>
  <!-- Disclaimer -->
  <text x="200" y="343" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#0369a1" opacity="0.5">Indicative layout · Not to scale · Verify with developer</text>
</svg>