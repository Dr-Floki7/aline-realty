<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" width="400" height="380">
  <!-- Background -->
  <rect width="400" height="380" fill="#fef9c3"/>
  <!-- Grid lines -->
  <line x1="40" y1="40" x2="40" y2="340" stroke="#ca8a04" stroke-width="0.4" opacity="0.3"/>
  <line x1="360" y1="40" x2="360" y2="340" stroke="#ca8a04" stroke-width="0.4" opacity="0.3"/>
  <line x1="40" y1="40" x2="360" y2="40" stroke="#ca8a04" stroke-width="0.4" opacity="0.3"/>
  <line x1="40" y1="340" x2="360" y2="340" stroke="#ca8a04" stroke-width="0.4" opacity="0.3"/>
  <!-- Outer boundary -->
  <rect x="36" y="36" width="328" height="308" fill="none" stroke="#ca8a04" stroke-width="2" rx="2"/>
  <!-- Room layout -->
  <!-- Master Bedroom -->
  <rect x="40" y="40" width="120" height="110" fill="white" stroke="#ca8a04" stroke-width="1.5" rx="2"/>
  <text x="100" y="99" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#92400e">Master Bed</text>
  <!-- Bedroom 2 -->
  <rect x="170" y="40" width="100" height="110" fill="white" stroke="#ca8a04" stroke-width="1.5" rx="2"/>
  <text x="220" y="99" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#92400e">Bedroom 2</text>
  <!-- Bedroom 3 -->
  <rect x="280" y="40" width="80" height="110" fill="white" stroke="#ca8a04" stroke-width="1.5" rx="2"/>
  <text x="320" y="99" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#92400e">Bed 3</text>
  <!-- Living + Dining -->
  <rect x="40" y="160" width="200" height="100" fill="white" stroke="#ca8a04" stroke-width="1.5" rx="2"/>
  <text x="140" y="214" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#92400e">Living / Dining</text>
  <!-- Kitchen -->
  <rect x="250" y="160" width="110" height="100" fill="white" stroke="#ca8a04" stroke-width="1.5" rx="2"/>
  <text x="305" y="214" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#92400e">Kitchen</text>
  <!-- Balcony -->
  <rect x="40" y="270" width="320" height="38" fill="#fef9c3" stroke="#ca8a04" stroke-width="1" rx="2" opacity="0.6"/>
  <text x="200" y="293" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#92400e" opacity="0.8">Balcony</text>
  <!-- Labels at top -->
  <rect x="0" y="0" width="400" height="32" fill="#ca8a04" opacity="0.9" rx="0"/>
  <text x="12" y="20" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="white">Type B2 · 3 BHK · Tower B</text>
  <!-- Area info footer -->
  <rect x="0" y="350" width="400" height="30" fill="#1f2937" opacity="0.9"/>
  <text x="12" y="370" font-family="Arial,sans-serif" font-size="10" fill="#c99830">SBA: 1,551 sq.ft</text>
  <text x="200" y="370" font-family="Arial,sans-serif" font-size="10" fill="#9ca3af">Carpet: 1,060 sq.ft</text>
  <!-- Disclaimer -->
  <text x="200" y="343" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#92400e" opacity="0.5">Indicative layout · Not to scale · Verify with developer</text>
</svg>